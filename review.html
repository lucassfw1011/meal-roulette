<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Write a Review - Meal Roulette</title>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1322;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #151d30;
      border: 1px solid #233148;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .back-btn {
      display: inline-block;
      background: #233148;
      color: #cbd5e1;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #334155; color: #fff; }

    h2 {
      margin-top: 0;
      color: #f59e0b;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    input, select, textarea {
      background: #0d1527;
      color: #f8fafc;
      border: 1px solid #253550;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    /* Dynamic Restaurant Info Card */
    .restaurant-info-card {
      display: none;
      background: #0d1527;
      border: 1px solid #233148;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: -4px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .info-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #94a3b8; font-weight: 600; }
    .maps-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
      margin-top: 4px;
    }
    .maps-link-btn:hover { text-decoration: underline; }

    /* Star Rating Widget */
    .star-rating {
      display: flex;
      gap: 8px;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }
    .star { color: #475569; transition: color 0.15s; }
    .star.selected, .star:hover, .star:hover ~ .star { color: #f59e0b; }
    .star-rating:hover .star { color: #f59e0b; }
    .star-rating .star:hover ~ .star { color: #475569; }

    .submit-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #0284c7; color: #fff; }

    .divider {
      height: 1px;
      background-color: #233148;
      margin: 20px 0;
    }

    .existing-reviews-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .review-card {
      background: #0d1527;
      border: 1px solid #233148;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .review-stars { color: #f59e0b; font-size: 14px; margin-bottom: 4px; }
    .review-dish { color: #38bdf8; font-weight: 600; margin-bottom: 2px; }
    .review-text { color: #cbd5e1; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="back-btn">← Back to Meal Roulette</a>

    <h2>✍️ Write a Restaurant Review</h2>

    <form id="reviewForm" onsubmit="handleFormSubmit(event)">
      <!-- Restaurant Select/Type Box -->
      <div class="form-group">
        <label for="restaurantSelect">Type or Select a Restaurant:</label>
        <input list="restaurantsList" id="restaurantSelect" placeholder="Type or select a restaurant..." oninput="onRestaurantChange()" required autocomplete="off" />
        <datalist id="restaurantsList"></datalist>
      </div>

      <!-- Selected Restaurant Info Details Card -->
      <div id="restaurantInfoCard" class="restaurant-info-card">
        <div id="infoName" class="info-title"></div>
        <div class="info-row">
          <span><span class="info-label">Category:</span> <span id="infoCategory">-</span></span>
          <span><span class="info-label">Price:</span> <span id="infoPrice">-</span></span>
          <span><span class="info-label">Location:</span> <span id="infoLocation">-</span></span>
        </div>
        <div class="info-row">
          <span><span class="info-label">Shop/Outlet:</span> <span id="infoShop">-</span></span>
          <span><span class="info-label">Off Day:</span> <span id="infoOffDay">-</span></span>
        </div>
        <div class="info-row" id="infoRemarkRow">
          <span><span class="info-label">Remark:</span> <span id="infoRemark">-</span></span>
        </div>
        <a id="infoMapsUrl" href="#" target="_blank" class="maps-link-btn">📍 Open in Google Maps</a>
      </div>

      <!-- Rating Stars -->
      <div class="form-group">
        <label>Rating (1 - 5 Stars):</label>
        <div class="star-rating" id="starRating">
          <span class="star" onclick="setRating(1)">★</span>
          <span class="star" onclick="setRating(2)">★</span>
          <span class="star" onclick="setRating(3)">★</span>
          <span class="star" onclick="setRating(4)">★</span>
          <span class="star" onclick="setRating(5)">★</span>
        </div>
        <input type="hidden" id="ratingValue" name="rating" value="5" required />
      </div>

      <!-- Recommended Dish -->
      <div class="form-group">
        <label for="recommendedDish">Recommended Dish(es):</label>
        <input type="text" id="recommendedDish" placeholder="e.g. Char Kway Teow, Nasi Lemak" />
      </div>

      <!-- Details / Comments -->
      <div class="form-group">
        <label for="reviewComments">Details / Comments (Optional):</label>
        <textarea id="reviewComments" rows="3" placeholder="How was the food, wait time, atmosphere?"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit Review</button>
    </form>

    <div class="divider"></div>

    <!-- Existing Reviews List -->
    <div class="existing-reviews-title">💬 Existing Reviews</div>
    <div id="reviewsContainer" style="color: #94a3b8; font-size: 13px;">
      Select a restaurant above to see past reviews.
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const RESTAURANTS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const REVIEWS_TAB_GID = '324231370';
    const REVIEWS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${REVIEWS_TAB_GID}`;

    // AppScript Web App URL for writing review rows to your Google Sheet
    const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

    let allRestaurants = [];
    let allReviews = [];
    let selectedRating = 5;

    function parseCSVLine(text) {
      const result = []; let cell = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      result.push(cell.trim()); return result;
    }

    function getProp(obj, possibleKeys) {
      for (let key in obj) {
        const cleanKey = key.trim().toLowerCase();
        for (let pk of possibleKeys) {
          if (cleanKey === pk.toLowerCase()) return obj[key];
        }
      }
      return '';
    }

    async function init() {
      setRating(5);

      // 1. Fetch Restaurants Data
      try {
        const res = await fetch(RESTAURANTS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          allRestaurants = lines.slice(1).map(l => {
            const c = parseCSVLine(l);
            return {
              name: c[0] || '',
              category: c[1] || '',
              price: c[2] || '',
              location: c[3] || '',
              shop: c[9] || '-',
              offDay: c[10] || 'None',
              remark: c[11] || '-',
              mapsUrl: c[12] || ''
            };
          }).filter(r => r.name);

          const datalist = document.getElementById('restaurantsList');
          datalist.innerHTML = allRestaurants.map(r => `<option value="${r.name}">${r.location ? `(${r.location})` : ''}</option>`).join('');
        }
      } catch(e) { console.error("Error loading restaurants", e); }

      // 2. Fetch Reviews Data
      try {
        const res = await fetch(REVIEWS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          const headers = parseCSVLine(lines[0]);
          allReviews = lines.slice(1).map(l => {
            const cells = parseCSVLine(l);
            const obj = {};
            headers.forEach((h, i) => { obj[h] = cells[i] || ''; });
            return obj;
          });
        }
      } catch(e) { console.error("Error loading reviews", e); }

      // Read URL Parameter (e.g., review.html?restaurant=Cendol)
      const urlParams = new URLSearchParams(window.location.search);
      const prefillRes = urlParams.get('restaurant');
      if (prefillRes) {
        document.getElementById('restaurantSelect').value = prefillRes;
        onRestaurantChange();
      }
    }

    function onRestaurantChange() {
      const val = document.getElementById('restaurantSelect').value.trim();
      const infoCard = document.getElementById('restaurantInfoCard');

      const match = allRestaurants.find(r => r.name.toLowerCase() === val.toLowerCase());

      if (match) {
        // Populate Info Card
        document.getElementById('infoName').innerText = match.name;
        document.getElementById('infoCategory').innerText = match.category || '-';
        document.getElementById('infoPrice').innerText = match.price || '-';
        document.getElementById('infoLocation').innerText = match.location || '-';
        document.getElementById('infoShop').innerText = match.shop && match.shop !== '' ? match.shop : '-';
        document.getElementById('infoOffDay').innerText = match.offDay && match.offDay !== '' ? match.offDay : 'None';

        const remarkRow = document.getElementById('infoRemarkRow');
        if (match.remark && match.remark !== '-' && match.remark.trim() !== '') {
          document.getElementById('infoRemark').innerText = match.remark;
          remarkRow.style.display = 'flex';
        } else {
          remarkRow.style.display = 'none';
        }

        const mapsBtn = document.getElementById('infoMapsUrl');
        if (match.mapsUrl && match.mapsUrl.startsWith('http')) {
          mapsBtn.href = match.mapsUrl;
        } else {
          const searchQuery = encodeURIComponent(`${match.name} ${match.location}`);
          mapsBtn.href = `https://www.google.com/maps/search/?api=1&query=${searchQuery}`;
        }

        infoCard.style.display = 'block';
      } else {
        infoCard.style.display = 'none';
      }

      // Filter and Render Existing Reviews
      renderExistingReviews(val);
    }

    function renderExistingReviews(restaurantName) {
      const container = document.getElementById('reviewsContainer');
      if (!restaurantName) {
        container.innerHTML = 'Select a restaurant above to see past reviews.';
        return;
      }

      const matches = allReviews.filter(r => {
        const name = getProp(r, ['restaurant', 'name', 'place']);
        return name.trim().toLowerCase() === restaurantName.trim().toLowerCase();
      });

      if (matches.length === 0) {
        container.innerHTML = 'No reviews yet for this restaurant. Be the first!';
        return;
      }

      const html = matches.map(r => {
        const rating = parseInt(getProp(r, ['rating', 'stars', 'score'])) || 0;
        const dish = getProp(r, ['recommendeddishes', 'recommendeddish', 'dishes', 'dish']);
        const comment = getProp(r, ['reviewtext', 'review', 'details', 'comments', 'comment']);

        return `
          <div class="review-card">
            <div class="review-stars">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>
            ${dish ? `<div class="review-dish">🍲 Recommended: ${dish}</div>` : ''}
            ${comment ? `<div class="review-text">"${comment}"</div>` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    function setRating(val) {
      selectedRating = val;
      document.getElementById('ratingValue').value = val;
      const stars = document.querySelectorAll('#starRating .star');
      stars.forEach((s, idx) => {
        if (idx < val) s.style.color = '#f59e0b';
        else s.style.color = '#475569';
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const payload = {
        restaurant: document.getElementById('restaurantSelect').value.trim(),
        rating: selectedRating,
        recommendedDish: document.getElementById('recommendedDish').value.trim(),
        comments: document.getElementById('reviewComments').value.trim(),
        timestamp: new Date().toISOString()
      };

      try {
        if (APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
          await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        alert('Review submitted successfully!');
        window.location.reload();
      } catch(err) {
        console.error(err);
        alert('Submitted successfully!');
        window.location.reload();
      }
    }

    init();
  </script>
</body>
</html>
