<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { margin-bottom: 20px; font-weight: 700; }
    .nav-bar { margin-bottom: 20px; }
    .nav-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      background: #1e293b;
      transition: all 0.2s;
    }
    .nav-link:hover { background: #334155; color: #fff; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 24px;
    }
    .filter-group { position: relative; display: inline-block; }
    .filter-group label {
      font-weight: 500;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .dropdown-btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      cursor: pointer;
      min-width: 130px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #1e293b;
      min-width: 180px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }
    .dropdown-content.show { display: block; }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      color: #e2e8f0;
    }
    .clear-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      cursor: pointer;
      height: 36px;
    }
    .clear-btn:hover { background-color: #ef4444; color: #ffffff; }

    .wheel-container { position: relative; margin-bottom: 24px; }
    .pointer-arrow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #f59e0b;
      z-index: 5;
    }
    canvas { width: 400px; height: 400px; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    #spinBtn {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 600;
      font-size: 16px;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #spinBtn:disabled { background-color: #475569; color: #94a3b8; }
    #result { font-size: 18px; margin-top: 16px; min-height: 28px; color: #cbd5e1; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%; max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h2 { margin-top: 0; color: #f59e0b; font-size: 22px; }
    .modal-detail-item { margin: 8px 0; font-size: 14px; }
    .modal-detail-item strong { color: #94a3b8; }
    .modal-section-title {
      margin-top: 16px; margin-bottom: 8px;
      font-weight: 600; font-size: 14px; color: #38bdf8;
      border-top: 1px solid #334155; padding-top: 12px;
    }
    .dish-tag {
      display: inline-block;
      background: #334155; color: #f8fafc;
      padding: 4px 10px; border-radius: 12px;
      font-size: 12px; margin: 3px 2px;
    }
    .write-review-btn {
      display: block; width: 100%; text-align: center;
      box-sizing: border-box; margin-top: 16px;
      padding: 10px; background: #38bdf8; color: #0f172a;
      font-weight: 600; text-decoration: none; border-radius: 6px;
    }
    .modal-close-btn {
      margin-top: 10px; width: 100%; padding: 10px;
      background: #f59e0b; color: #0f172a;
      font-weight: 600; border: none; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎰 Meal Roulette</h1>
  
  <div class="nav-bar">
    <a href="review.html" class="nav-link">✍️ Write a Review / Search Restaurants</a>
  </div>

  <div class="filters"></div>

  <div class="wheel-container">
    <div class="pointer-arrow"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
  </div>

  <button id="spinBtn" onclick="spinWheel()">SPIN!</button>
  <div id="result"></div>

  <!-- Winner Modal -->
  <div id="winnerModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modalTitle">🎉 Restaurant Name</h2>
      <div id="modalDetails"></div>
      
      <div class="modal-section-title">⭐ Community Rating</div>
      <div id="averageRatingText" style="font-size: 13px; color: #94a3b8; margin-bottom: 6px;">Loading ratings...</div>
      
      <div class="modal-section-title">🍲 Recommended Dishes</div>
      <div id="recommendedDishesContainer" style="font-size: 13px; color: #cbd5e1;">No dishes recommended yet.</div>

      <a id="reviewRedirectBtn" href="#" class="write-review-btn">✍️ Write a Review for this Place</a>
      <button class="modal-close-btn" onclick="closeModal()">Awesome!</button>
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQDp75IsVpocDgm-tdLiSTVl_6Shm6vUrgvbvcUCW15yHCUN0BGzK1MHZuKF-n1gCkiw/exec';

    let rawRows = [];
    let headers = [];
    let activeList = [];
    let selectedFilters = {};
    let allReviewsCache = [];

    const colors = ["#FCD34D", "#6EE7B7", "#93C5FD", "#FBCFE8", "#C4B5FD", "#FCA5A5", "#5EEAD4", "#FDBA74"];
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;
    let currentAngle = 0;
    let isSpinning = false;

    function parseCSVLine(text) {
      const result = []; let cell = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      result.push(cell.trim()); return result;
    }

    function cleanWheelName(name) {
      if (!name) return "";
      return name.replace(/\b(restaurant|restoran|kitchen|kopitiam|cafe|food court|hawker)\b/gi, "").replace(/\s+/g, " ").trim();
    }

    async function loadMealsFromSheet() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
        if (lines.length < 2) return;

        headers = parseCSVLine(lines[0]);
        rawRows = lines.slice(1).map(line => {
          const values = parseCSVLine(line);
          let item = {};
          headers.forEach((h, idx) => item[h] = values[idx] || '');
          return item;
        }).filter(item => item[headers[0]]);

        headers.slice(1).forEach(h => selectedFilters[h] = []);
        renderFilters();
        drawWheel();
        loadAllReviews();
      } catch (err) { console.error("Error loading data:", err); }
    }

    async function loadAllReviews() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        if (res.ok) allReviewsCache = await res.json();
      } catch(e) {}
    }

    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
        document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
      }
    };

    function toggleDropdown(header) {
      const id = `dropdown-${header.replace(/\s+/g, '-')}`;
      const dropdown = document.getElementById(id);
      document.querySelectorAll('.dropdown-content').forEach(el => { if (el !== dropdown) el.classList.remove('show'); });
      if (dropdown) dropdown.classList.toggle('show');
    }

    function renderFilters() {
      const filterContainer = document.querySelector(".filters");
      if (!filterContainer) return;
      let filterHTML = "";
      headers.slice(1).forEach(header => {
        const validOptions = new Set();
        rawRows.forEach(row => {
          const matchesOther = Object.keys(selectedFilters).every(other => {
            if (other === header) return true;
            return selectedFilters[other].length === 0 || selectedFilters[other].includes(row[other]);
          });
          if (matchesOther && row[header]) validOptions.add(row[header]);
        });

        const opts = Array.from(validOptions).sort();
        const sel = selectedFilters[header] || [];
        let btnText = sel.length === 1 ? sel[0] : (sel.length > 1 ? `${sel.length} Selected` : "All");

        filterHTML += `
          <div class="filter-group">
            <label>${header}:</label>
            <button class="dropdown-btn" onclick="toggleDropdown('${header}')">
              <span>${btnText}</span> <span style="font-size: 10px; color: #94a3b8;">▼</span>
            </button>
            <div id="dropdown-${header.replace(/\s+/g, '-')}" class="dropdown-content">
              ${opts.map(val => `
                <label class="dropdown-item">
                  <input type="checkbox" value="${val}" ${sel.includes(val) ? 'checked' : ''} onchange="toggleOption('${header}', '${val}')">
                  <span>${val}</span>
                </label>
              `).join("")}
            </div>
          </div>`;
      });
      filterHTML += `<button class="clear-btn" onclick="clearAllFilters()">Clear Filters</button>`;
      filterContainer.innerHTML = filterHTML;
    }

    function toggleOption(header, val) {
      const idx = selectedFilters[header].indexOf(val);
      if (idx > -1) selectedFilters[header].splice(idx, 1);
      else selectedFilters[header].push(val);
      renderFilters(); drawWheel();
    }

    function clearAllFilters() {
      Object.keys(selectedFilters).forEach(h => selectedFilters[h] = []);
      renderFilters(); drawWheel();
    }

    function getFilteredMeals() {
      return rawRows.filter(row => Object.keys(selectedFilters).every(h => selectedFilters[h].length === 0 || selectedFilters[h].includes(row[h])));
    }

    function drawWheel() {
      if (!ctx) return;
      activeList = getFilteredMeals();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (activeList.length === 0) return;

      const numSlices = activeList.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;
      ctx.save(); ctx.translate(radius, radius);

      activeList.forEach((meal, i) => {
        const startAngle = i * sliceAngle + currentAngle;
        const endAngle = startAngle + sliceAngle;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length]; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = "#0f172a"; ctx.stroke();

        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#0f172a";
        ctx.font = `600 13px system-ui`;
        ctx.fillText(cleanWheelName(meal[headers[0]]), radius - 15, 5);
        ctx.restore();
      });

      ctx.beginPath(); ctx.arc(0, 0, 40, 0, 2 * Math.PI);
      ctx.fillStyle = "#1e293b"; ctx.fill();
      ctx.strokeStyle = "#f59e0b"; ctx.stroke();
      ctx.font = "24px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("🎰", 0, 0);
      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || activeList.length === 0) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("result").innerText = "Spinning...";

      const totalRotation = (5 + Math.random() * 5) * 2 * Math.PI + Math.random() * 2 * Math.PI;
      const start = performance.now();
      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / 4000, 1);
        currentAngle = totalRotation * (1 - Math.pow(1 - progress, 3));
        drawWheel();
        if (progress < 1) requestAnimationFrame(animate);
        else { isSpinning = false; document.getElementById("spinBtn").disabled = false; calculateWinner(); }
      }
      requestAnimationFrame(animate);
    }

    function calculateWinner() {
      const numSlices = activeList.length;
      let normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
      let winningIndex = (numSlices - 1 - Math.floor(normalizedAngle / ((2 * Math.PI) / numSlices)) + numSlices) % numSlices;
      const winner = activeList[winningIndex];
      document.getElementById("result").innerText = `🎉 Let's eat: ${winner[headers[0]]}!`;
      showWinnerModal(winner);
    }

    function showWinnerModal(winner) {
      const restaurantName = winner[headers[0]];
      document.getElementById("modalTitle").innerText = `🎉 ${restaurantName}`;

      let detailsHTML = "";
      headers.slice(1).forEach(h => {
        if (winner[h]) detailsHTML += `<div class="modal-detail-item"><strong>${h}:</strong> ${winner[h]}</div>`;
      });
      document.getElementById("modalDetails").innerHTML = detailsHTML;

      // Link to review page with pre-selected restaurant parameter
      document.getElementById("reviewRedirectBtn").href = `review.html?restaurant=${encodeURIComponent(restaurantName)}`;

      // Load Reviews
      const matches = allReviewsCache.filter(r => r.Restaurant === restaurantName);
      const ratings = matches.map(r => Number(r.Rating)).filter(n => n > 0);
      document.getElementById("averageRatingText").innerText = ratings.length > 0 
        ? `⭐ ${(ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1)} / 5.0 (${ratings.length} reviews)`
        : "No ratings submitted yet. Be the first!";

      const dishesRaw = matches.map(r => r.RecommendedDishes).filter(Boolean);
      document.getElementById("recommendedDishesContainer").innerHTML = dishesRaw.length > 0 
        ? dishesRaw.flatMap(d => d.split(',')).map(d => `<span class="dish-tag">🍲 ${d.trim()}</span>`).join("")
        : "No dishes recommended yet.";

      document.getElementById("winnerModal").classList.add("active");
    }

    function closeModal() { document.getElementById("winnerModal").classList.remove("active"); }

    loadMealsFromSheet();
  </script>
</body>
</html>
