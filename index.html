<script>
  const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  let meals = [];
  let currentFilter = "All";
  let activeList = [];
  const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6", "#ef4444", "#14b8a6"];
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  let currentAngle = 0;
  let isSpinning = false;

  async function loadMealsFromSheet() {
    try {
      const response = await fetch(SHEET_URL);
      const text = await response.text();
      const jsonData = JSON.parse(text.substring(47, text.length - 2));
      const rows = jsonData.table.rows;

      meals = rows.map(row => ({
        name: row.c[0] ? row.c[0].v : '',
        category: row.c[1] ? row.c[1].v : 'Quick'
      })).filter(m => m.name !== '');

      drawWheel();
    } catch (err) {
      console.error("Error loading Google Sheet:", err);
    }
  }

  function getFilteredMeals() {
    if (currentFilter === "All") return meals;
    return meals.filter(m => m.category === currentFilter);
  }

  function drawWheel() {
    activeList = getFilteredMeals();
    const numSlices = activeList.length;
    if (numSlices === 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }
    const sliceAngle = (2 * Math.PI) / numSlices;
    const radius = canvas.width / 2;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(radius, radius);

    activeList.forEach((meal, i) => {
      const startAngle = i * sliceAngle + currentAngle;
      const endAngle = startAngle + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, startAngle, endAngle);
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#0f172a";
      ctx.stroke();

      ctx.save();
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 24px system-ui";
      ctx.fillText(meal.name, radius - 30, 8);
      ctx.restore();
    });
    ctx.restore();
  }

  function spinWheel() {
    if (isSpinning || activeList.length === 0) return;
    isSpinning = true;
    document.getElementById("spinBtn").disabled = true;
    document.getElementById("result").innerText = "Spinning...";

    const spinRounds = 5 + Math.random() * 5;
    const extraAngle = Math.random() * 2 * Math.PI;
    const totalRotation = spinRounds * 2 * Math.PI + extraAngle;
    const start = performance.now();
    const duration = 4000;

    function animate(time) {
      const elapsed = time - start;
      const progress = Math.min(elapsed / duration, 1);
      const easeOut = 1 - Math.pow(1 - progress, 3);
      currentAngle = totalRotation * easeOut;
      drawWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        isSpinning = false;
        document.getElementById("spinBtn").disabled = false;
        calculateWinner();
      }
    }
    requestAnimationFrame(animate);
  }

  function calculateWinner() {
    const numSlices = activeList.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    let normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
    let winningIndex = numSlices - 1 - Math.floor(normalizedAngle / sliceAngle);
    winningIndex = (winningIndex + numSlices) % numSlices;
    document.getElementById("result").innerText = `🎉 Let's eat: ${activeList[winningIndex].name}!`;
  }

  function filterMeals(category) {
    currentFilter = category;
    document.querySelectorAll(".chip").forEach(btn => {
      btn.classList.toggle("active", btn.innerText.includes(category) || (category === "All" && btn.innerText === "All"));
    });
    drawWheel();
  }

  // Load dataset from Google Sheet on start
  loadMealsFromSheet();
</script>
