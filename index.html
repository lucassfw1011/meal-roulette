<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 10px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }
    .filter-group {
      position: relative;
      display: inline-block;
    }
    .filter-group label {
      font-weight: bold;
      font-size: 14px;
      display: block;
      margin-bottom: 4px;
      color: #fff;
    }
    .dropdown-btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      background: #1e293b;
      color: #fff;
      border: 1px solid #475569;
      cursor: pointer;
      min-width: 140px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #1e293b;
      min-width: 180px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 8px;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }
    .dropdown-content.show {
      display: block;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }
    .dropdown-item:hover {
      background-color: #334155;
    }
    .dropdown-item input[type="checkbox"] {
      cursor: pointer;
    }
    .wheel-container {
      position: relative;
      margin-bottom: 20px;
    }
    canvas {
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #spinBtn {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #spinBtn:hover {
      background-color: #d97706;
    }
    #spinBtn:disabled {
      background-color: #64748b;
      cursor: not-allowed;
    }
    #result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
      min-height: 30px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🎰 Meal Roulette</h1>
  
  <div class="filters"></div>

  <div class="wheel-container">
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
  </div>

  <button id="spinBtn" onclick="spinWheel()">SPIN!</button>
  <div id="result"></div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    let rawRows = [];
    let headers = [];
    let activeList = [];
    let selectedFilters = {}; // Stores arrays of selected options per category

    const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6", "#ef4444", "#14b8a6"];
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;
    let currentAngle = 0;
    let isSpinning = false;

    function parseCSVLine(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim());
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell.trim());
      return result;
    }

    async function loadMealsFromSheet() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("Failed to fetch Google Sheet CSV");
        
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");

        if (lines.length < 2) return;

        headers = parseCSVLine(lines[0]);

        rawRows = lines.slice(1).map(line => {
          const values = parseCSVLine(line);
          let item = {};
          headers.forEach((h, idx) => {
            item[h] = values[idx] || '';
          });
          return item;
        }).filter(item => item[headers[0]] && item[headers[0]].length > 0);

        // Initialize selected filters as empty arrays
        headers.slice(1).forEach(h => selectedFilters[h] = []);

        renderFilters();
        drawWheel();
      } catch (err) {
        console.error("Error loading spreadsheet data:", err);
        document.getElementById("result").innerText = "⚠️ Failed to load sheet data.";
      }
    }

    // Close dropdowns if clicked outside
    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
        document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
      }
    };

    function toggleDropdown(header) {
      const id = `dropdown-${header.replace(/\s+/g, '-')}`;
      const dropdown = document.getElementById(id);
      document.querySelectorAll('.dropdown-content').forEach(el => {
        if (el !== dropdown) el.classList.remove('show');
      });
      if (dropdown) dropdown.classList.toggle('show');
    }

    function renderFilters() {
      const filterContainer = document.querySelector(".filters");
      if (!filterContainer) return;

      let filterHTML = "";

      headers.slice(1).forEach(header => {
        // Calculate options valid based on current choices in OTHER filter categories
        const validOptionsForCategory = new Set();
        
        rawRows.forEach(row => {
          // Check if row satisfies all OTHER active filters
          const matchesOtherFilters = Object.keys(selectedFilters).every(otherHeader => {
            if (otherHeader === header) return true;
            const selected = selectedFilters[otherHeader];
            return selected.length === 0 || selected.includes(row[otherHeader]);
          });

          if (matchesOtherFilters && row[header]) {
            validOptionsForCategory.add(row[header]);
          }
        });

        const availableOptions = Array.from(validOptionsForCategory).sort();
        const selected = selectedFilters[header] || [];

        let buttonText = "All";
        if (selected.length === 1) buttonText = selected[0];
        else if (selected.length > 1) buttonText = `${selected.length} Selected`;

        const safeHeaderId = header.replace(/\s+/g, '-');

        filterHTML += `
          <div class="filter-group">
            <label>${header}:</label>
            <button class="dropdown-btn" onclick="toggleDropdown('${header}')">
              <span>${buttonText}</span>
              <span style="font-size: 10px;">▼</span>
            </button>
            <div id="dropdown-${safeHeaderId}" class="dropdown-content">
              ${availableOptions.map(val => `
                <label class="dropdown-item">
                  <input type="checkbox" value="${val}" ${selected.includes(val) ? 'checked' : ''} onchange="toggleOption('${header}', '${val}')">
                  <span>${val}</span>
                </label>
              `).join("")}
              ${availableOptions.length === 0 ? '<div style="font-size:12px; color:#94a3b8; padding:4px;">No matching options</div>' : ''}
            </div>
          </div>
        `;
      });

      filterContainer.innerHTML = filterHTML;
    }

    function toggleOption(header, val) {
      const index = selectedFilters[header].indexOf(val);
      if (index > -1) {
        selectedFilters[header].splice(index, 1);
      } else {
        selectedFilters[header].push(val);
      }
      
      renderFilters();
      drawWheel();
    }

    function getFilteredMeals() {
      return rawRows.filter(row => {
        return Object.keys(selectedFilters).every(header => {
          const selected = selectedFilters[header];
          return selected.length === 0 || selected.includes(row[header]);
        });
      });
    }

    function drawWheel() {
      if (!ctx) return;
      activeList = getFilteredMeals();
      const numSlices = activeList.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;
      ctx.save();
      ctx.translate(radius, radius);

      const nameHeader = headers[0];

      activeList.forEach((meal, i) => {
        const startAngle = i * sliceAngle + currentAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px system-ui";
        ctx.fillText(meal[nameHeader] || '', radius - 30, 6);
        ctx.restore();
      });
      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || activeList.length === 0) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("result").innerText = "Spinning...";

      const spinRounds = 5 + Math.random() * 5;
      const extraAngle = Math.random() * 2 * Math.PI;
      const totalRotation = spinRounds * 2 * Math.PI + extraAngle;
      const start = performance.now();
      const duration = 4000;

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById("spinBtn").disabled = false;
          calculateWinner();
        }
      }
      requestAnimationFrame(animate);
    }

    function calculateWinner() {
      const numSlices = activeList.length;
      if (numSlices === 0) return;

      const sliceAngle = (2 * Math.PI) / numSlices;
      let normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
      let winningIndex = numSlices - 1 - Math.floor(normalizedAngle / sliceAngle);
      winningIndex = (winningIndex + numSlices) % numSlices;
      const nameHeader = headers[0];
      document.getElementById("result").innerText = `🎉 Let's eat: ${activeList[winningIndex][nameHeader]}!`;
    }

    loadMealsFromSheet();
  </script>
</body>
</html>
