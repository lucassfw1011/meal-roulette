<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin-bottom: 24px;
    }
    .filter-group {
      position: relative;
      display: inline-block;
    }
    .filter-group label {
      font-weight: 500;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .dropdown-btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 400;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      cursor: pointer;
      min-width: 130px;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.15s ease;
    }
    .dropdown-btn:hover {
      border-color: #64748b;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #1e293b;
      min-width: 180px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      z-index: 10;
      max-height: 200px;
      overflow-y: auto;
    }
    .dropdown-content.show {
      display: block;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      color: #e2e8f0;
    }
    .dropdown-item:hover {
      background-color: #334155;
    }
    .dropdown-item input[type="checkbox"] {
      cursor: pointer;
    }
    .clear-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 36px;
    }
    .clear-btn:hover {
      background-color: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }
    .wheel-container {
      position: relative;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .pointer-arrow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #f59e0b;
      z-index: 5;
      filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.4));
    }
    canvas {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #spinBtn {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 600;
      font-size: 16px;
      padding: 12px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    #spinBtn:hover {
      background-color: #d97706;
    }
    #spinBtn:active {
      transform: scale(0.98);
    }
    #spinBtn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    #result {
      font-size: 18px;
      font-weight: 500;
      margin-top: 16px;
      min-height: 28px;
      text-align: center;
      color: #cbd5e1;
    }

    /* Modal / Pop-Up Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
      text-align: left;
    }
    .modal-card h2 {
      margin-top: 0;
      color: #f59e0b;
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-detail-item {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal-detail-item strong {
      color: #94a3b8;
      font-weight: 500;
    }
    .modal-section-title {
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: #38bdf8;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }
    .modal-close-btn {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .modal-close-btn:hover {
      background: #d97706;
    }
  </style>
</head>
<body>

  <h1>🎰 Meal Roulette</h1>
  
  <div class="filters"></div>

  <div class="wheel-container">
    <div class="pointer-arrow"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
  </div>

  <button id="spinBtn" onclick="spinWheel()">SPIN!</button>
  <div id="result"></div>

  <!-- Winner Modal Window -->
  <div id="winnerModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modalTitle">🎉 Restaurant Name</h2>
      <div id="modalDetails"></div>
      
      <div class="modal-section-title">⭐ Community Rating (Coming Soon)</div>
      <div style="font-size: 13px; color: #94a3b8;">Ratings and reviews will be available here in a future update!</div>

      <div class="modal-section-title">🍲 Recommended Dishes (Coming Soon)</div>
      <div style="font-size: 13px; color: #94a3b8;">Add your favorite dishes here to share recommendations.</div>

      <button class="modal-close-btn" onclick="closeModal()">Awesome!</button>
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    let rawRows = [];
    let headers = [];
    let activeList = [];
    let selectedFilters = {};

    const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6", "#ef4444", "#14b8a6"];
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas ? canvas.getContext("2d") : null;
    let currentAngle = 0;
    let isSpinning = false;

    function parseCSVLine(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim());
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell.trim());
      return result;
    }

    async function loadMealsFromSheet() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("Failed to fetch Google Sheet CSV");
        
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");

        if (lines.length < 2) return;

        headers = parseCSVLine(lines[0]);

        rawRows = lines.slice(1).map(line => {
          const values = parseCSVLine(line);
          let item = {};
          headers.forEach((h, idx) => {
            item[h] = values[idx] || '';
          });
          return item;
        }).filter(item => item[headers[0]] && item[headers[0]].length > 0);

        headers.slice(1).forEach(h => selectedFilters[h] = []);

        renderFilters();
        drawWheel();
      } catch (err) {
        console.error("Error loading spreadsheet data:", err);
        document.getElementById("result").innerText = "⚠️ Failed to load sheet data.";
      }
    }

    window.onclick = function(event) {
      if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
        document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
      }
    };

    function toggleDropdown(header) {
      const id = `dropdown-${header.replace(/\s+/g, '-')}`;
      const dropdown = document.getElementById(id);
      document.querySelectorAll('.dropdown-content').forEach(el => {
        if (el !== dropdown) el.classList.remove('show');
      });
      if (dropdown) dropdown.classList.toggle('show');
    }

    function renderFilters() {
      const filterContainer = document.querySelector(".filters");
      if (!filterContainer) return;

      let filterHTML = "";

      headers.slice(1).forEach(header => {
        const validOptionsForCategory = new Set();
        
        rawRows.forEach(row => {
          const matchesOtherFilters = Object.keys(selectedFilters).every(otherHeader => {
            if (otherHeader === header) return true;
            const selected = selectedFilters[otherHeader];
            return selected.length === 0 || selected.includes(row[otherHeader]);
          });

          if (matchesOtherFilters && row[header]) {
            validOptionsForCategory.add(row[header]);
          }
        });

        const availableOptions = Array.from(validOptionsForCategory).sort();
        const selected = selectedFilters[header] || [];

        let buttonText = "All";
        if (selected.length === 1) buttonText = selected[0];
        else if (selected.length > 1) buttonText = `${selected.length} Selected`;

        const safeHeaderId = header.replace(/\s+/g, '-');

        filterHTML += `
          <div class="filter-group">
            <label>${header}:</label>
            <button class="dropdown-btn" onclick="toggleDropdown('${header}')">
              <span>${buttonText}</span>
              <span style="font-size: 10px; color: #94a3b8;">▼</span>
            </button>
            <div id="dropdown-${safeHeaderId}" class="dropdown-content">
              ${availableOptions.map(val => `
                <label class="dropdown-item">
                  <input type="checkbox" value="${val}" ${selected.includes(val) ? 'checked' : ''} onchange="toggleOption('${header}', '${val}')">
                  <span>${val}</span>
                </label>
              `).join("")}
              ${availableOptions.length === 0 ? '<div style="font-size:12px; color:#94a3b8; padding:4px;">No matching options</div>' : ''}
            </div>
          </div>
        `;
      });

      filterHTML += `
        <button class="clear-btn" onclick="clearAllFilters()">Clear Filters</button>
      `;

      filterContainer.innerHTML = filterHTML;
    }

    function toggleOption(header, val) {
      const index = selectedFilters[header].indexOf(val);
      if (index > -1) {
        selectedFilters[header].splice(index, 1);
      } else {
        selectedFilters[header].push(val);
      }
      
      renderFilters();
      drawWheel();
    }

    function clearAllFilters() {
      Object.keys(selectedFilters).forEach(header => {
        selectedFilters[header] = [];
      });
      renderFilters();
      drawWheel();
    }

    function getFilteredMeals() {
      return rawRows.filter(row => {
        return Object.keys(selectedFilters).every(header => {
          const selected = selectedFilters[header];
          return selected.length === 0 || selected.includes(row[header]);
        });
      });
    }

    function drawWheel() {
      if (!ctx) return;
      activeList = getFilteredMeals();
      const numSlices = activeList.length;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;
      ctx.save();
      ctx.translate(radius, radius);

      const nameHeader = headers[0];

      // Dynamic Font Calculation based on number of items
      let fontSize = 16;
      if (numSlices > 30) fontSize = 10;
      else if (numSlices > 20) fontSize = 12;
      else if (numSlices > 12) fontSize = 14;

      activeList.forEach((meal, i) => {
        const startAngle = i * sliceAngle + currentAngle;
        const endAngle = startAngle + sliceAngle;

        // Draw Slice
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        // Draw Text
        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = `500 ${fontSize}px system-ui, -apple-system, sans-serif`;

        let text = meal[nameHeader] || '';
        // Truncate long names to prevent overlap near center
        const maxLen = numSlices > 20 ? 14 : 20;
        if (text.length > maxLen) {
          text = text.substring(0, maxLen - 1) + '…';
        }

        ctx.fillText(text, radius - 20, fontSize / 3);
        ctx.restore();
      });
      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || activeList.length === 0) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("result").innerText = "Spinning...";

      const spinRounds = 5 + Math.random() * 5;
      const extraAngle = Math.random() * 2 * Math.PI;
      const totalRotation = spinRounds * 2 * Math.PI + extraAngle;
      const start = performance.now();
      const duration = 4000;

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById("spinBtn").disabled = false;
          calculateWinner();
        }
      }
      requestAnimationFrame(animate);
    }

    function calculateWinner() {
      const numSlices = activeList.length;
      if (numSlices === 0) return;

      const sliceAngle = (2 * Math.PI) / numSlices;
      let normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
      let winningIndex = numSlices - 1 - Math.floor(normalizedAngle / sliceAngle);
      winningIndex = (winningIndex + numSlices) % numSlices;
      
      const winner = activeList[winningIndex];
      const nameHeader = headers[0];
      
      document.getElementById("result").innerText = `🎉 Let's eat: ${winner[nameHeader]}!`;
      showWinnerModal(winner);
    }

    function showWinnerModal(winner) {
      const nameHeader = headers[0];
      document.getElementById("modalTitle").innerText = `🎉 ${winner[nameHeader]}`;

      let detailsHTML = "";
      headers.slice(1).forEach(h => {
        if (winner[h]) {
          detailsHTML += `
            <div class="modal-detail-item">
              <strong>${h}:</strong> ${winner[h]}
            </div>
          `;
        }
      });

      document.getElementById("modalDetails").innerHTML = detailsHTML;
      document.getElementById("winnerModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("winnerModal").classList.remove("active");
    }

    loadMealsFromSheet();
  </script>
</body>
</html>
