<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1322;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Full Background Layer Base */
.pixel-bg-layer {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: -1;
  pointer-events: none;
  background-position: center;
  opacity: 0.25;
}

/* Stretched Full Screen */
.pixel-bg-layer.bg-cover {
  background-repeat: no-repeat;
  background-size: cover;
}

/* Tiled / Duplicated Grid Pattern */
.pixel-bg-layer.bg-repeat {
  background-repeat: repeat;
  background-size: auto;
}
    /* Top and Bottom Containers */
    .pixel-top-bar, .pixel-bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      pointer-events: none;
      z-index: 0;
      padding: 0 10vw;
    }
    .pixel-top-bar { top: 10px; }
    .pixel-bottom-bar { bottom: 10px; }

    /* Side Container Panels for Pixel Assets */
    .pixel-sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 18vw;
      max-width: 200px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 20px 0;
    }
    .pixel-sidebar.left { left: 2vw; }
    .pixel-sidebar.right { right: 2vw; }

    /* Animation Keyframes */
    @keyframes pixelFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(3deg); }
    }
    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pixelSway {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(10px) rotate(-5deg); }
    }

    .pixel-asset {
      image-rendering: pixelated; /* Keeps pixel art crisp */
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      opacity: 0.85;
      transition: transform 0.3s ease;
    }
    .anim-float { animation: pixelFloat infinite ease-in-out; }
    .anim-bounce { animation: pixelBounce infinite ease-in-out; }
    .anim-sway { animation: pixelSway infinite ease-in-out; }

    /* Hide side assets on very narrow screens to keep center UI clean */
    @media (max-width: 600px) {
      .pixel-sidebar, .pixel-top-bar, .pixel-bottom-bar { display: none; }
    }

    /* Main Content Wrapper */
    .main-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Top Link Button */
    .top-link-btn {
      display: inline-block;
      width: 100%;
      max-width: 480px;
      background: #142036;
      color: #38bdf8;
      border: 1px solid #223454;
      border-radius: 20px;
      padding: 10px 16px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .top-link-btn:hover {
      background: #1a2a47;
      border-color: #38bdf8;
    }

    /* Filters Card Container */
    .filters-card {
      width: 100%;
      max-width: 480px;
      background: #151d30;
      border: 1px solid #233148;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    /* Dropdowns Grid (2x2) */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 13px; color: #94a3b8; font-weight: 500; }
    select {
      background: #0d1527;
      color: #f8fafc;
      border: 1px solid #253550;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    /* Meal Session Section */
    .meal-section-title {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }
    
    .meal-pills-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .meal-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meal-pill {
      background: #0d1527;
      color: #94a3b8;
      border: 1px solid #253550;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .meal-pill.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 700;
    }

    /* Clear All Filters Button */
    .clear-btn-container {
      display: flex;
      justify-content: flex-end;
    }
    .clear-btn {
      background: transparent;
      color: #f87171;
      border: 1px solid #991b1b;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clear-btn:hover { background: rgba(239, 68, 68, 0.1); }

    /* Wheel Container */
    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 10px auto 20px auto;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #f59e0b;
      z-index: 10;
    }

    .spin-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 18px;
      border: none;
      padding: 12px 36px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      margin-top: 5px;
    }
    .spin-btn:hover { background: #0284c7; color: #fff; transform: translateY(-2px); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Result Modal Window */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 19, 34, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-content {
      background: #151d30;
      border: 1px solid #233148;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal h2 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; }
    .modal p { margin: 6px 0; color: #cbd5e1; font-size: 14px; line-height: 1.4; }
    .modal strong { color: #f8fafc; }

    .meta-details {
      background: #0d1527;
      border: 1px solid #233148;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 12px 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .meta-line { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
    .meta-line:last-child { margin-bottom: 0; }
    .meta-tag { color: #cbd5e1; }
    .meta-tag strong { color: #38bdf8; }

    .reviews-box {
      margin-top: 12px;
      background: #0d1527;
      border: 1px solid #233148;
      border-radius: 8px;
      padding: 12px;
      max-height: 160px;
      overflow-y: auto;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #233148;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .review-item {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #151d30;
    }
    .review-stars { color: #f59e0b; }
    
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-btn {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-spin-again { background: #f59e0b; color: #0f172a; grid-column: span 2; font-size: 15px; font-weight: 700; }
    .btn-spin-again:hover { background: #d97706; }
    .btn-close { background: #475569; color: #fff; }
    .btn-maps { background: #10b981; color: #ffffff; }
    .btn-review { background: #38bdf8; color: #0f172a; grid-column: span 2; }
  </style>
</head>
<body>

  <!-- Full Background Layer -->
  <div id="pixelBg" class="pixel-bg-layer"></div>

  <!-- Top and Bottom Containers -->
  <div id="pixelTop" class="pixel-top-bar"></div>
  <div id="pixelBottom" class="pixel-bottom-bar"></div>

  <!-- Dynamic Side Containers for Pixel Art Assets -->
  <div id="pixelSidebarLeft" class="pixel-sidebar left"></div>
  <div id="pixelSidebarRight" class="pixel-sidebar right"></div>

  <div class="main-content">
    <a href="review.html" class="top-link-btn">✍️ Write a Review / Search Restaurants</a>

    <div class="filters-card">
      <div class="filter-grid">
        <div class="filter-group">
          <label>Category:</label>
          <select id="filterCategory" onchange="applyFilters()">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Price:</label>
          <select id="filterPrice" onchange="applyFilters()">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Location:</label>
          <select id="filterLocation" onchange="applyFilters()">
            <option value="ALL">All</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Off Day:</label>
          <select id="filterOffDay" onchange="applyFilters()">
            <option value="ALL">All</option>
          </select>
        </div>
      </div>

      <div class="meal-section-title">Meal Session / Business Hour:</div>
      
      <div class="meal-pills-container">
        <div class="meal-row">
          <button class="meal-pill active" onclick="selectMealSession('AllDay', this)">All Day</button>
        </div>
        <div class="meal-row">
          <button class="meal-pill" onclick="selectMealSession('Breakfast', this)">Breakfast</button>
          <button class="meal-pill" onclick="selectMealSession('Lunch', this)">Lunch</button>
          <button class="meal-pill" onclick="selectMealSession('Teatime', this)">Teatime</button>
          <button class="meal-pill" onclick="selectMealSession('Dinner', this)">Dinner</button>
          <button class="meal-pill" onclick="selectMealSession('Supper', this)">Supper</button>
        </div>
      </div>

      <div class="clear-btn-container">
        <button class="clear-btn" onclick="clearAllFilters()">Clear All Filters</button>
      </div>
    </div>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
    </div>

    <button id="spinBtn" class="spin-btn" onclick="spinWheel()">SPIN!</button>
  </div>

  <!-- Result Modal Window -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h2 id="resName">Restaurant Name</h2>
      
      <p><strong>Category:</strong> <span id="resCategory"></span> | <strong>Price:</strong> <span id="resPrice"></span></p>
      <p><strong>Location:</strong> <span id="resLocation"></span></p>

      <div class="meta-details">
        <div class="meta-line">
          <span class="meta-tag"><strong>Shop / Outlet:</strong> <span id="resShop"></span></span>
          <span class="meta-tag"><strong>Off Day:</strong> <span id="resOffDay"></span></span>
        </div>
        <div class="meta-line" id="resRemarkRow" style="margin-top: 4px;">
          <span class="meta-tag"><strong>Remark:</strong> <span id="resRemark"></span></span>
        </div>
      </div>

      <div class="reviews-box">
        <div class="review-header">
          <span style="font-weight: 700; color: #38bdf8; font-size: 13px;">Community Ratings</span>
          <span id="resAvgRating" style="color: #f59e0b; font-weight: 700; font-size: 13px;">No Ratings</span>
        </div>
        <div id="resReviewsList" style="color: #94a3b8; font-size: 12px; text-align: center; padding: 10px;">
          No ratings yet. Be the first to review!
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-spin-again" onclick="closeModalAndSpinAgain()">🔄 Spin Again!</button>
        <button class="modal-btn btn-close" onclick="closeModal()">Close</button>
        <a id="resMapsLink" href="#" target="_blank" class="modal-btn btn-maps">📍 Open Maps</a>
        <a id="resReviewLink" href="#" class="modal-btn btn-review">✍️ Write / View Reviews</a>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const RESTAURANTS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const REVIEWS_TAB_GID = '324231370';
    const REVIEWS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${REVIEWS_TAB_GID}`;

    const PIXEL_ASSETS_TAB_GID = '642604358';
    const PIXEL_ASSETS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${PIXEL_ASSETS_TAB_GID}`;

    let allRestaurants = [];
    let filteredRestaurants = [];
    let allReviews = [];

    let activeMealSession = 'AllDay';
    let isSpinning = false;
    let currentAngle = 0;
    let currentWinner = null;

    const COLORS = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];

    function parseCSVLine(text) {
      const result = []; let cell = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      result.push(cell.trim()); return result;
    }

    function getProp(obj, possibleKeys) {
      for (let key in obj) {
        const cleanKey = key.trim().toLowerCase();
        for (let pk of possibleKeys) {
          if (cleanKey === pk.toLowerCase()) return obj[key];
        }
      }
      return '';
    }

    async function init() {
      // 1. Fetch Restaurants
      try {
        const res = await fetch(RESTAURANTS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          allRestaurants = lines.slice(1).map(l => {
            const c = parseCSVLine(l);
            const isBreakfast = c[4] === '1';
            const isLunch = c[5] === '1';
            const isTeatime = c[6] === '1';
            const isDinner = c[7] === '1';
            const isSupper = c[8] === '1';
            const isAllDay = (isBreakfast && isLunch && isTeatime && isDinner && isSupper);

            return {
              name: c[0] || '',
              category: c[1] || '',
              price: c[2] || '',
              location: c[3] || '',
              breakfast: isBreakfast,
              lunch: isLunch,
              teatime: isTeatime,
              dinner: isDinner,
              supper: isSupper,
              allday: isAllDay,
              shop: c[9] || '-',
              offDay: c[10] || 'None',
              remark: c[11] || '-',
              mapsUrl: c[12] || ''
            };
          }).filter(r => r.name);

          populateFilterOptions();
          applyFilters();
        }
      } catch(e) { console.error("Error loading restaurants", e); }

      // 2. Fetch Reviews
      try {
        const res = await fetch(REVIEWS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          const revHeaders = parseCSVLine(lines[0]);
          allReviews = lines.slice(1).map(l => {
            const cells = parseCSVLine(l);
            const obj = {};
            revHeaders.forEach((h, i) => { obj[h] = cells[i] || ''; });
            return obj;
          });
        }
      } catch(e) { console.error("Error loading reviews", e); }

      // 3. Fetch & Render Dynamic Pixel Assets
      loadPixelAssets();
    }

   async function loadPixelAssets() {
  if (PIXEL_ASSETS_TAB_GID === 'YOUR_PIXEL_ASSETS_TAB_GID_HERE') return;

  try {
    const res = await fetch(PIXEL_ASSETS_CSV_URL);
    const text = await res.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length <= 1) return;

    const leftBox = document.getElementById('pixelSidebarLeft');
    const rightBox = document.getElementById('pixelSidebarRight');
    const topBox = document.getElementById('pixelTop');
    const bottomBox = document.getElementById('pixelBottom');
    const bgBox = document.getElementById('pixelBg');

    if (leftBox) leftBox.innerHTML = '';
    if (rightBox) rightBox.innerHTML = '';
    if (topBox) topBox.innerHTML = '';
    if (bottomBox) bottomBox.innerHTML = '';
    if (bgBox) { 
      bgBox.style.backgroundImage = 'none'; 
      bgBox.className = 'pixel-bg-layer'; // Reset classes
    }

    lines.slice(1).forEach(line => {
      const c = parseCSVLine(line);
      const url = c[0];
      const side = (c[1] || 'Left').toLowerCase();
      const animation = (c[2] || 'Float').toLowerCase();
      const size = c[3] || '80';
      const speed = c[4] || '6';

      if (!url || !url.startsWith('http')) return;

      // Full Background Handling
      if (side.includes('bg') || side.includes('background')) {
        if (bgBox) {
          bgBox.style.backgroundImage = `url('${url}')`;
          if (side.includes('repeat') || side.includes('tile') || side.includes('duplicate')) {
            bgBox.className = 'pixel-bg-layer bg-repeat';
          } else {
            bgBox.className = 'pixel-bg-layer bg-cover';
          }
        }
        return;
      }

      // Floating Assets (Left, Right, Top, Bottom)
      const img = document.createElement('img');
      img.src = url;
      img.className = `pixel-asset anim-${animation}`;
      img.style.width = `${size}px`;
      img.style.animationDuration = `${speed}s`;

      if (side === 'right') {
        if (rightBox) rightBox.appendChild(img);
      } else if (side === 'top') {
        if (topBox) topBox.appendChild(img);
      } else if (side === 'bottom') {
        if (bottomBox) bottomBox.appendChild(img);
      } else {
        if (leftBox) leftBox.appendChild(img);
      }
    });
  } catch (e) {
    console.error("Error loading pixel assets from sheet:", e);
  }
}

    function populateFilterOptions() {
      const categories = [...new Set(allRestaurants.map(r => r.category).filter(Boolean))].sort();
      const prices = [...new Set(allRestaurants.map(r => r.price).filter(Boolean))].sort();
      const locations = [...new Set(allRestaurants.map(r => r.location).filter(Boolean))].sort();
      const offDays = [...new Set(allRestaurants.map(r => r.offDay).filter(Boolean))].sort();

      populateSelect('filterCategory', categories);
      populateSelect('filterPrice', prices);
      populateSelect('filterLocation', locations);
      populateSelect('filterOffDay', offDays);
    }

    function populateSelect(id, items) {
      const el = document.getElementById(id);
      el.innerHTML = `<option value="ALL">All</option>` + 
        items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function selectMealSession(session, btn) {
      activeMealSession = session;
      document.querySelectorAll('.meal-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function clearAllFilters() {
      document.getElementById('filterCategory').value = 'ALL';
      document.getElementById('filterPrice').value = 'ALL';
      document.getElementById('filterLocation').value = 'ALL';
      document.getElementById('filterOffDay').value = 'ALL';
      
      const allDayBtn = document.querySelectorAll('.meal-pill')[0];
      selectMealSession('AllDay', allDayBtn);
    }

    function applyFilters() {
      const cat = document.getElementById('filterCategory').value;
      const prc = document.getElementById('filterPrice').value;
      const loc = document.getElementById('filterLocation').value;
      const off = document.getElementById('filterOffDay').value;

      filteredRestaurants = allRestaurants.filter(r => {
        if (cat !== 'ALL' && r.category !== cat) return false;
        if (prc !== 'ALL' && r.price !== prc) return false;
        if (loc !== 'ALL' && r.location !== loc) return false;
        if (off !== 'ALL' && r.offDay !== off) return false;

        if (activeMealSession !== 'AllDay') {
          const key = activeMealSession.toLowerCase();
          if (!r[key] && !r.allday) return false;
        }

        return true;
      });

      drawWheel();
    }

    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const numSlices = filteredRestaurants.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.fillStyle = '#f87171';
        ctx.textAlign = 'center';
        ctx.font = '14px sans-serif';
        ctx.fillText('No restaurants match filters!', 160, 160);
        document.getElementById('spinBtn').disabled = true;
        return;
      }
      document.getElementById('spinBtn').disabled = false;

      const sliceAngle = (2 * Math.PI) / numSlices;
      const centerX = 160, centerY = 160, radius = 155;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(currentAngle);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#0d1322';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        
        let name = filteredRestaurants[i].name;
        if (name.length > 16) name = name.substring(0, 14) + '...';
        ctx.fillText(name, radius - 15, 4);
        ctx.restore();
      }

      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || filteredRestaurants.length === 0) return;
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const numSlices = filteredRestaurants.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      
      const winningIndex = Math.floor(Math.random() * numSlices);
      currentWinner = filteredRestaurants[winningIndex];

      const extraRotations = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI;
      const targetSliceCenter = (winningIndex * sliceAngle) + (sliceAngle / 2);
      const targetAngle = extraRotations + ((3 * Math.PI / 2) - targetSliceCenter);

      const duration = 4000;
      const start = performance.now();
      const startAngle = currentAngle % (2 * Math.PI);

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResultModal();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResultModal() {
      if (!currentWinner) return;

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        zIndex: 2000
      });

      document.getElementById('resName').innerText = currentWinner.name;
      document.getElementById('resCategory').innerText = currentWinner.category || '-';
      document.getElementById('resPrice').innerText = currentWinner.price || '-';
      document.getElementById('resLocation').innerText = currentWinner.location || '-';

      document.getElementById('resShop').innerText = currentWinner.shop && currentWinner.shop !== '' ? currentWinner.shop : '-';
      document.getElementById('resOffDay').innerText = currentWinner.offDay && currentWinner.offDay !== '' ? currentWinner.offDay : 'None';
      
      const remarkRow = document.getElementById('resRemarkRow');
      if (currentWinner.remark && currentWinner.remark !== '-' && currentWinner.remark.trim() !== '') {
        document.getElementById('resRemark').innerText = currentWinner.remark;
        remarkRow.style.display = 'block';
      } else {
        remarkRow.style.display = 'none';
      }

      const mapsBtn = document.getElementById('resMapsLink');
      if (currentWinner.mapsUrl && currentWinner.mapsUrl.startsWith('http')) {
        mapsBtn.href = currentWinner.mapsUrl;
      } else {
        const searchQuery = encodeURIComponent(`${currentWinner.name} ${currentWinner.location}`);
        mapsBtn.href = `https://www.google.com/maps/search/?api=1&query=${searchQuery}`;
      }

      document.getElementById('resReviewLink').href = `review.html?restaurant=${encodeURIComponent(currentWinner.name)}`;

      const matches = allReviews.filter(r => {
        const rName = getProp(r, ['restaurant', 'name', 'place']);
        return rName.trim().toLowerCase() === currentWinner.name.trim().toLowerCase();
      });

      const listEl = document.getElementById('resReviewsList');
      const avgEl = document.getElementById('resAvgRating');

      if (matches.length === 0) {
        avgEl.innerText = "No Ratings";
        listEl.innerHTML = "No ratings yet. Be the first to review!";
      } else {
        let totalStars = 0;
        let count = 0;

        const html = matches.map(r => {
          const rating = parseInt(getProp(r, ['rating', 'stars', 'score'])) || 0;
          if (rating > 0) { totalStars += rating; count++; }
          const dish = getProp(r, ['recommendeddishes', 'recommendeddish', 'dishes', 'dish']);
          const comment = getProp(r, ['reviewtext', 'review', 'details', 'comments', 'comment']);

          return `
            <div class="review-item">
              <div class="review-stars">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>
              ${dish ? `<div style="color:#38bdf8; font-weight:600;">🍲 ${dish}</div>` : ''}
              ${comment ? `<div style="color:#cbd5e1;">"${comment}"</div>` : ''}
            </div>
          `;
        }).join('');

        avgEl.innerText = count > 0 ? `★ ${(totalStars / count).toFixed(1)} (${matches.length})` : `${matches.length} Review(s)`;
        listEl.innerHTML = html;
      }

      document.getElementById('resultModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('resultModal').style.display = 'none';
      document.getElementById('spinBtn').disabled = false;
    }

    function closeModalAndSpinAgain() {
      closeModal();
      setTimeout(() => { spinWheel(); }, 300);
    }

    init();
  </script>
</body>
