<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-btn {
      display: inline-block;
      background-color: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 20px;
      transition: background 0.2s, color 0.2s;
    }
    .header-btn:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* Filters Box */
    .filter-container {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .dropdown-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-group label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }
    .filter-group select {
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      outline: none;
    }

    /* Meal Chips Layout */
    .meal-chips-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }

    .meal-chips-section .section-label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .top-chip-row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .sub-chips-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip-btn {
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .chip-btn:hover {
      border-color: #38bdf8;
      color: #f8fafc;
    }
    .chip-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .clear-btn {
      background: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      align-self: flex-end;
      margin-top: -8px;
    }
    .clear-btn:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Wheel Canvas */
    .wheel-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #f59e0b;
      position: absolute;
      top: -12px;
      z-index: 10;
    }

    #wheelCanvas {
      background: transparent;
    }

    .spin-btn {
      margin-top: 20px;
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s, background 0.2s;
    }
    .spin-btn:hover { background: #d97706; }
    .spin-btn:active { transform: scale(0.95); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    .modal h2 { margin-top: 0; color: #38bdf8; }
    .modal p { color: #cbd5e1; font-size: 14px; margin: 8px 0; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer;
    }
    .modal-btn.primary { background: #38bdf8; color: #0f172a; }
    .modal-btn.secondary { background: #334155; color: #fff; }
  </style>
</head>
<body>

  <a href="review.html" class="header-btn">✍️ Write a Review / Search Restaurants</a>

  <div class="filter-container">
    <!-- Standard Dropdowns (Category, Price, Location, Off Day) -->
    <div class="dropdown-row" id="dropdownRow"></div>

    <!-- Meal Time Chips Section -->
    <div class="meal-chips-section">
      <span class="section-label">Meal Session / Business Hour:</span>
      
      <!-- Top Row: Centered All Day -->
      <div class="top-chip-row">
        <button class="chip-btn active" id="chipAllDay" onclick="toggleMealChip('All Day')">All Day</button>
      </div>

      <!-- Bottom Row: Meal Options -->
      <div class="sub-chips-row">
        <button class="chip-btn" data-meal="Breakfast" onclick="toggleMealChip('Breakfast')">Breakfast</button>
        <button class="chip-btn" data-meal="Lunch" onclick="toggleMealChip('Lunch')">Lunch</button>
        <button class="chip-btn" data-meal="Teatime" onclick="toggleMealChip('Teatime')">Teatime</button>
        <button class="chip-btn" data-meal="Dinner" onclick="toggleMealChip('Dinner')">Dinner</button>
        <button class="chip-btn" data-meal="Supper" onclick="toggleMealChip('Supper')">Supper</button>
      </div>
    </div>

    <button class="clear-btn" onclick="clearAllFilters()">Clear All Filters</button>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
  </div>

  <button class="spin-btn" onclick="spinWheel()">SPIN!</button>

  <!-- Winner Modal -->
  <div class="modal-overlay" id="winnerModal">
    <div class="modal">
      <h2 id="winnerTitle">Restaurant Name</h2>
      <div id="winnerDetails" style="text-align: left; margin: 16px 0;"></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal()">Close</button>
        <button class="modal-btn primary" id="reviewRedirectBtn">View / Review</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    const MEAL_COLUMNS = ['Breakfast', 'Lunch', 'Teatime', 'Dinner', 'Supper'];
    let rawRows = [];
    let headers = [];
    let dropdownFilters = {}; // Category, Price, Location, Off Day
    let selectedMeals = [];   // empty or array like ['Lunch', 'Dinner']
    let isAllDaySelected = true;

    // Wheel state
    let filteredRestaurants = [];
    let currentAngle = 0;
    let isSpinning = false;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");

    function parseCSVLine(text) {
      const result = []; let cell = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      result.push(cell.trim()); return result;
    }

    async function loadSheetData() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");
        if (lines.length < 2) return;

        headers = parseCSVLine(lines[0]);
        rawRows = lines.slice(1).map(line => {
          const cells = parseCSVLine(line);
          const obj = {};
          headers.forEach((h, i) => { obj[h] = cells[i] || ''; });
          return obj;
        });

        renderDropdownFilters();
        applyFiltersAndDraw();
      } catch(e) { console.error("CSV Load Error:", e); }
    }

    function renderDropdownFilters() {
      const dropdownRow = document.getElementById("dropdownRow");
      dropdownRow.innerHTML = "";

      // Non-meal dropdown columns
      const ignoreCols = ["Restaurant", ...MEAL_COLUMNS];

      headers.forEach(h => {
        if (ignoreCols.includes(h)) return;

        // Get unique options
        const uniqueVals = [...new Set(rawRows.map(r => r[h]).filter(Boolean))].sort();

        const group = document.createElement("div");
        group.className = "filter-group";
        
        const label = document.createElement("label");
        label.innerText = h + ":";

        const select = document.createElement("select");
        select.innerHTML = `<option value="">All</option>` + uniqueVals.map(v => `<option value="${v}">${v}</option>`).join("");
        select.onchange = (e) => {
          dropdownFilters[h] = e.target.value;
          applyFiltersAndDraw();
        };

        group.appendChild(label);
        group.appendChild(select);
        dropdownRow.appendChild(group);
      });
    }

    function toggleMealChip(meal) {
      if (meal === 'All Day') {
        isAllDaySelected = true;
        selectedMeals = [];
      } else {
        isAllDaySelected = false;
        if (selectedMeals.includes(meal)) {
          selectedMeals = selectedMeals.filter(m => m !== meal);
          if (selectedMeals.length === 0) isAllDaySelected = true;
        } else {
          selectedMeals.push(meal);
        }
      }
      updateChipUI();
      applyFiltersAndDraw();
    }

    function updateChipUI() {
      document.getElementById('chipAllDay').classList.toggle('active', isAllDaySelected);
      document.querySelectorAll('.sub-chips-row .chip-btn').forEach(btn => {
        const meal = btn.getAttribute('data-meal');
        btn.classList.toggle('active', !isAllDaySelected && selectedMeals.includes(meal));
      });
    }

    function clearAllFilters() {
      dropdownFilters = {};
      selectedMeals = [];
      isAllDaySelected = true;
      document.querySelectorAll('.dropdown-row select').forEach(s => s.value = "");
      updateChipUI();
      applyFiltersAndDraw();
    }

    function applyFiltersAndDraw() {
      filteredRestaurants = rawRows.filter(row => {
        // 1. Dropdown matching
        for (const [key, val] of Object.entries(dropdownFilters)) {
          if (val && row[key] !== val) return false;
        }

        // 2. Meal 1/0 column matching
        if (!isAllDaySelected && selectedMeals.length > 0) {
          // Restaurant must have a "1" in AT LEAST ONE selected meal time
          const matchesAnyMeal = selectedMeals.some(meal => row[meal] === "1");
          if (!matchesAnyMeal) return false;
        }

        return true;
      });

      drawWheel();
    }

    function drawWheel() {
      const numItems = filteredRestaurants.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numItems === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("No restaurants match filters!", canvas.width / 2, canvas.height / 2);
        return;
      }

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / numItems;

      const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'];

      filteredRestaurants.forEach((r, i) => {
        const angle = currentAngle + i * sliceAngle;

        // Draw Slice
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw Text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(r.Restaurant || "", radius - 15, 4);
        ctx.restore();
      });

      // Center Knob
      ctx.beginPath();
      ctx.arc(centerX, centerY, 24, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function spinWheel() {
      if (isSpinning || filteredRestaurants.length === 0) return;
      isSpinning = true;

      const spinAngle = Math.random() * 10 + 20; // 20 - 30 rotations
      const duration = 4000; // ms
      const start = performance.now();
      const initialAngle = currentAngle;

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        // Ease out quadratic
        const easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = initialAngle + easeOut * spinAngle;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showWinner();
        }
      }
      requestAnimationFrame(animate);
    }

    function showWinner() {
      const numItems = filteredRestaurants.length;
      const sliceAngle = (2 * Math.PI) / numItems;
      
      // Calculate which slice landed under pointer (-90 degrees / top)
      let normalizedAngle = (3 * Math.PI / 2 - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const winningIndex = Math.floor(normalizedAngle / sliceAngle);
      const winner = filteredRestaurants[winningIndex];

      document.getElementById("winnerTitle").innerText = winner.Restaurant;
      
      let detailsHtml = "";
      for (const [key, val] of Object.entries(winner)) {
        if (key !== "Restaurant" && val && val !== "0") {
          detailsHtml += `<p><strong>${key}:</strong> ${val === "1" ? "Yes" : val}</p>`;
        }
      }
      document.getElementById("winnerDetails").innerHTML = detailsHtml;

      document.getElementById("reviewRedirectBtn").onclick = () => {
        window.location.href = `review.html?restaurant=${encodeURIComponent(winner.Restaurant)}`;
      };

      document.getElementById("winnerModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("winnerModal").style.display = "none";
    }

    loadSheetData();
  </script>
</body>
</html>
