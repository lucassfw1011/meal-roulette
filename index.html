<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }

    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { font-size: 2rem; color: var(--accent); margin-bottom: 0.25rem; }
    p { color: var(--text-muted); font-size: 0.9rem; }

    .main-container { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; max-width: 480px; }

    /* Wheel Canvas Layout */
    .wheel-wrapper { position: relative; width: 320px; height: 320px; display: flex; justify-content: center; align-items: center; }
    .pointer {
      position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 14px solid transparent; border-right: 14px solid transparent;
      border-top: 24px solid #ef4444; z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

    /* Controls */
    .btn-spin {
      background: var(--accent); color: #000; font-weight: bold; font-size: 1.1rem;
      border: none; padding: 0.8rem 2.5rem; border-radius: 99px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4); transition: transform 0.1s, background 0.2s;
    }
    .btn-spin:active { transform: scale(0.95); }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Winner Popup Display */
    .result-box {
      background: var(--card-bg); width: 100%; padding: 1rem; border-radius: 12px;
      text-align: center; font-size: 1.2rem; font-weight: bold; border: 1px solid #334155; min-height: 60px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Filter Chips */
    .filter-bar { display: flex; gap: 0.5rem; width: 100%; overflow-x: auto; padding-bottom: 0.5rem; }
    .chip {
      background: #334155; color: var(--text-muted); border: none; padding: 0.4rem 0.9rem;
      border-radius: 20px; font-size: 0.85rem; cursor: pointer; whitespace: nowrap;
    }
    .chip.active { background: var(--accent); color: #000; font-weight: bold; }

    /* Add Option Form */
    .add-form { display: flex; gap: 0.5rem; width: 100%; }
    .add-form input {
      flex: 1; background: var(--card-bg); border: 1px solid #334155; color: var(--text);
      padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; outline: none;
    }
    .add-form button {
      background: #10b981; color: white; border: none; padding: 0.6rem 1rem;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meal Roulette</h1>
    <p>Spin to settle the "What to eat?" debate</p>
  </header>

  <div class="main-container">
    <!-- Filter Bar -->
    <div class="filter-bar">
      <button class="chip active" onclick="filterMeals('All')">All</button>
      <button class="chip" onclick="filterMeals('Quick')">Quick Lunch</button>
      <button class="chip" onclick="filterMeals('Heavy')">Heavy Dinner</button>
    </div>

    <!-- The Wheel -->
    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spinWheel()">SPIN!</button>

    <!-- Winner Output -->
    <div class="result-box" id="result">Tap SPIN to pick a place!</div>

    <!-- Input Form to Add Ideas -->
    <form class="add-form" onsubmit="addMeal(event)">
      <input type="text" id="mealInput" placeholder="Add a new spot..." required />
      <button type="submit">Add</button>
    </form>
  </div>

  <script>
    // Initial Dataset
    let meals = [
      { name: "Noodle House", category: "Quick" },
      { name: "Burger Joint", category: "Heavy" },
      { name: "Sushi Bar", category: "Quick" },
      { name: "Chicken Rice", category: "Quick" },
      { name: "Steakhouse", category: "Heavy" },
      { name: "Salad Bar", category: "Quick" }
    ];

    let currentFilter = "All";
    let activeList = [...meals];

    const colors = ["#f59e0b", "#10b981", "#3b82f6", "#ec4899", "#8b5cf6", "#ef4444", "#14b8a6"];
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    let currentAngle = 0;
    let isSpinning = false;

    function getFilteredMeals() {
      if (currentFilter === "All") return meals;
      return meals.filter(m => m.category === currentFilter);
    }

    function drawWheel() {
      activeList = getFilteredMeals();
      const numSlices = activeList.length;
      if (numSlices === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(radius, radius);

      activeList.forEach((meal, i) => {
        const startAngle = i * sliceAngle + currentAngle;
        const endAngle = startAngle + sliceAngle;

        // Draw Slice
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        // Draw Text
        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 24px system-ui";
        ctx.fillText(meal.name, radius - 30, 8);
        ctx.restore();
      });

      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || activeList.length === 0) return;
      isSpinning = true;
      document.getElementById("spinBtn").disabled = true;
      document.getElementById("result").innerText = "Spinning...";

      const spinRounds = 5 + Math.random() * 5; // 5 to 10 full spins
      const extraAngle = Math.random() * 2 * Math.PI;
      const totalRotation = spinRounds * 2 * Math.PI + extraAngle;
      
      const start = performance.now();
      const duration = 4000; // 4 seconds spin duration

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        
        // Ease-out cubic formula for natural deceleration
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = totalRotation * easeOut;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById("spinBtn").disabled = false;
          calculateWinner();
        }
      }

      requestAnimationFrame(animate);
    }

    function calculateWinner() {
      const numSlices = activeList.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      
      // Calculate final offset relative to top pointer (270 degrees or 3*PI/2)
      let normalizedAngle = (currentAngle + Math.PI / 2) % (2 * Math.PI);
      let winningIndex = numSlices - 1 - Math.floor(normalizedAngle / sliceAngle);
      winningIndex = (winningIndex + numSlices) % numSlices;

      document.getElementById("result").innerText = `🎉 Let's eat: ${activeList[winningIndex].name}!`;
    }

    function filterMeals(category) {
      currentFilter = category;
      document.querySelectorAll(".chip").forEach(btn => {
        btn.classList.toggle("active", btn.innerText.includes(category) || (category === "All" && btn.innerText === "All"));
      });
      drawWheel();
    }

    function addMeal(e) {
      e.preventDefault();
      const input = document.getElementById("mealInput");
      const name = input.value.trim();
      if (name) {
        meals.push({ name, category: "Quick" });
        input.value = "";
        drawWheel();
      }
    }

    // Initial Render
    drawWheel();
  </script>
</body>
</html>
