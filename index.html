<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meal Roulette</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    h1 { margin-top: 0; color: #38bdf8; font-size: 24px; text-align: center; }
    
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
      margin-bottom: 20px;
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 20px auto;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #f59e0b;
      z-index: 10;
    }

    .spin-btn {
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 18px;
      border: none;
      padding: 12px 36px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      margin-top: 10px;
    }
    .spin-btn:hover { background: #0284c7; color: #fff; transform: translateY(-2px); }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal h2 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; }
    .modal p { margin: 8px 0; color: #cbd5e1; font-size: 14px; }
    .modal strong { color: #f8fafc; }

    .reviews-box {
      margin-top: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .review-item {
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px dashed #1e293b;
    }
    .review-stars { color: #f59e0b; }
    
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
    }
    .btn-close { background: #475569; color: #fff; }
    .btn-review { background: #38bdf8; color: #0f172a; }
  </style>
</head>
<body>

  <h1>🎡 Meal Roulette</h1>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Category</label>
      <select id="filterCategory" onchange="applyFilters()"><option value="ALL">All Categories</option></select>
    </div>
    <div class="filter-group">
      <label>Meal Time</label>
      <select id="filterMealTime" onchange="applyFilters()">
        <option value="ALL">Any Time</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Teatime">Teatime</option>
        <option value="Dinner">Dinner</option>
        <option value="Supper">Supper</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Price</label>
      <select id="filterPrice" onchange="applyFilters()"><option value="ALL">All Prices</option></select>
    </div>
    <div class="filter-group">
      <label>Location</label>
      <select id="filterLocation" onchange="applyFilters()"><option value="ALL">All Locations</option></select>
    </div>
  </div>

  <!-- Wheel Canvas -->
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="320" height="320"></canvas>
  </div>

  <button id="spinBtn" class="spin-btn" onclick="spinWheel()">SPIN!</button>

  <!-- Winner Modal -->
  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h2 id="resName">Restaurant Name</h2>
      
      <p><strong>Category:</strong> <span id="resCategory"></span></p>
      <p><strong>Price:</strong> <span id="resPrice"></span></p>
      <p><strong>Location:</strong> <span id="resLocation"></span></p>
      <p><strong>Off Day:</strong> <span id="resOffDay"></span></p>
      <!-- Remark line added directly under Off Day -->
      <p id="resRemarkContainer"><strong>Remark:</strong> <span id="resRemark"></span></p>

      <div class="reviews-box">
        <div class="review-header">
          <span style="font-weight: 700; color: #38bdf8; font-size: 13px;">Reviews Summary</span>
          <span id="resAvgRating" style="color: #f59e0b; font-weight: 700; font-size: 13px;">No Ratings</span>
        </div>
        <div id="resReviewsList" style="color: #94a3b8; font-size: 12px; text-align: center; padding: 10px;">
          No reviews yet. Be the first to leave one!
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn btn-close" onclick="closeModal()">Close</button>
        <a id="resReviewLink" href="#" class="modal-btn btn-review">Write / View All Reviews</a>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1U2cY66OYCC7xnrvJ65nCOFcOWyGPkfLYe_-ogoFXaIU';
    const RESTAURANTS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const REVIEWS_TAB_GID = '324231370';
    const REVIEWS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${REVIEWS_TAB_GID}`;

    let allRestaurants = [];
    let filteredRestaurants = [];
    let allReviews = [];

    let isSpinning = false;
    let currentAngle = 0;
    let currentWinner = null;

    const COLORS = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];

    function parseCSVLine(text) {
      const result = []; let cell = ''; let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') inQuotes = !inQuotes;
        else if (c === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      result.push(cell.trim()); return result;
    }

    function getProp(obj, possibleKeys) {
      for (let key in obj) {
        const cleanKey = key.trim().toLowerCase();
        for (let pk of possibleKeys) {
          if (cleanKey === pk.toLowerCase()) return obj[key];
        }
      }
      return '';
    }

    async function init() {
      // 1. Fetch Restaurants
      try {
        const res = await fetch(RESTAURANTS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          allRestaurants = lines.slice(1).map(l => {
            const c = parseCSVLine(l);
            return {
              name: c[0] || '',
              category: c[1] || '',
              price: c[2] || '',
              location: c[3] || '',
              breakfast: c[4] === '1',
              lunch: c[5] === '1',
              teatime: c[6] === '1',
              dinner: c[7] === '1',
              supper: c[8] === '1',
              offDay: c[9] || 'None',
              remark: c[10] || '' // Col K: Remark
            };
          }).filter(r => r.name);
          populateFilterOptions();
          applyFilters();
        }
      } catch(e) { console.error("Error loading restaurants", e); }

      // 2. Fetch Reviews
      try {
        const res = await fetch(REVIEWS_CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length > 1) {
          const revHeaders = parseCSVLine(lines[0]);
          allReviews = lines.slice(1).map(l => {
            const cells = parseCSVLine(l);
            const obj = {};
            revHeaders.forEach((h, i) => { obj[h] = cells[i] || ''; });
            return obj;
          });
        }
      } catch(e) { console.error("Error loading reviews", e); }
    }

    function populateFilterOptions() {
      const categories = [...new Set(allRestaurants.map(r => r.category).filter(Boolean))].sort();
      const prices = [...new Set(allRestaurants.map(r => r.price).filter(Boolean))].sort();
      const locations = [...new Set(allRestaurants.map(r => r.location).filter(Boolean))].sort();

      populateSelect('filterCategory', categories);
      populateSelect('filterPrice', prices);
      populateSelect('filterLocation', locations);
    }

    function populateSelect(id, items) {
      const el = document.getElementById(id);
      const defaultText = el.options[0].text;
      el.innerHTML = `<option value="ALL">${defaultText}</option>` + 
        items.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function applyFilters() {
      const cat = document.getElementById('filterCategory').value;
      const meal = document.getElementById('filterMealTime').value;
      const prc = document.getElementById('filterPrice').value;
      const loc = document.getElementById('filterLocation').value;

      filteredRestaurants = allRestaurants.filter(r => {
        if (cat !== 'ALL' && r.category !== cat) return false;
        if (prc !== 'ALL' && r.price !== prc) return false;
        if (loc !== 'ALL' && r.location !== loc) return false;
        if (meal !== 'ALL') {
          const mealKey = meal.toLowerCase();
          if (!r[mealKey]) return false;
        }
        return true;
      });

      drawWheel();
    }

    function drawWheel() {
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const numSlices = filteredRestaurants.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSlices === 0) {
        ctx.fillStyle = '#f87171';
        ctx.textAlign = 'center';
        ctx.font = '14px sans-serif';
        ctx.fillText('No restaurants match filters!', 160, 160);
        document.getElementById('spinBtn').disabled = true;
        return;
      }
      document.getElementById('spinBtn').disabled = false;

      const sliceAngle = (2 * Math.PI) / numSlices;
      const centerX = 160, centerY = 160, radius = 155;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(currentAngle);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Text
        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        
        let name = filteredRestaurants[i].name;
        if (name.length > 16) name = name.substring(0, 14) + '...';
        ctx.fillText(name, radius - 15, 4);
        ctx.restore();
      }

      ctx.restore();
    }

    function spinWheel() {
      if (isSpinning || filteredRestaurants.length === 0) return;
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      const numSlices = filteredRestaurants.length;
      const sliceAngle = (2 * Math.PI) / numSlices;
      
      const winningIndex = Math.floor(Math.random() * numSlices);
      currentWinner = filteredRestaurants[winningIndex];

      const extraRotations = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI;
      const targetSliceCenter = (winningIndex * sliceAngle) + (sliceAngle / 2);
      const targetAngle = extraRotations + ((3 * Math.PI / 2) - targetSliceCenter);

      const duration = 4000;
      const start = performance.now();
      const startAngle = currentAngle % (2 * Math.PI);

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);

        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResultModal();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResultModal() {
      if (!currentWinner) return;

      document.getElementById('resName').innerText = currentWinner.name;
      document.getElementById('resCategory').innerText = currentWinner.category || '-';
      document.getElementById('resPrice').innerText = currentWinner.price || '-';
      document.getElementById('resLocation').innerText = currentWinner.location || '-';
      document.getElementById('resOffDay').innerText = currentWinner.offDay || 'None';

      // Set Remark
      const remarkContainer = document.getElementById('resRemarkContainer');
      const remarkEl = document.getElementById('resRemark');
      if (currentWinner.remark && currentWinner.remark.trim() !== '') {
        remarkEl.innerText = currentWinner.remark;
        remarkContainer.style.display = 'block';
      } else {
        remarkContainer.style.display = 'none';
      }

      // Review Link
      document.getElementById('resReviewLink').href = `review.html?restaurant=${encodeURIComponent(currentWinner.name)}`;

      // Filter matches from reviews
      const matches = allReviews.filter(r => {
        const rName = getProp(r, ['restaurant', 'name', 'place']);
        return rName.trim().toLowerCase() === currentWinner.name.trim().toLowerCase();
      });

      const listEl = document.getElementById('resReviewsList');
      const avgEl = document.getElementById('resAvgRating');

      if (matches.length === 0) {
        avgEl.innerText = "No Ratings";
        listEl.innerHTML = "No reviews yet. Be the first to leave one!";
      } else {
        let totalStars = 0;
        let count = 0;

        const html = matches.map(r => {
          const rating = parseInt(getProp(r, ['rating', 'stars', 'score'])) || 0;
          if (rating > 0) { totalStars += rating; count++; }
          const dish = getProp(r, ['recommendeddishes', 'recommendeddish', 'dishes', 'dish']);
          const comment = getProp(r, ['reviewtext', 'review', 'details', 'comments', 'comment']);

          return `
            <div class="review-item">
              <div class="review-stars">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</div>
              ${dish ? `<div style="color:#38bdf8; font-weight:600;">🍲 ${dish}</div>` : ''}
              ${comment ? `<div style="color:#cbd5e1;">"${comment}"</div>` : ''}
            </div>
          `;
        }).join('');

        avgEl.innerText = count > 0 ? `★ ${(totalStars / count).toFixed(1)} (${matches.length})` : `${matches.length} Review(s)`;
        listEl.innerHTML = html;
      }

      document.getElementById('resultModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('resultModal').style.display = 'none';
      document.getElementById('spinBtn').disabled = false;
    }

    init();
  </script>
</body>
</html>
