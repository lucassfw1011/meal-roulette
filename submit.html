<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suggest a Spot - Meal Roulette</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1322;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 480px;
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      background: #142036;
      color: #38bdf8;
      border: 1px solid #223454;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .back-btn:hover { background: #1a2a47; border-color: #38bdf8; }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }

    .form-card {
      background: #151d30;
      border: 1px solid #233148;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    input, select, textarea {
      background: #0d1527;
      color: #f8fafc;
      border: 1px solid #253550;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .session-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .session-chip {
      background: #1b1b1b;
      color: #a1a1a1;
      border: 1px solid #333333;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .session-chip.selected {
      background: #ff9900;
      color: #000000;
      border-color: #ff9900;
      font-weight: 700;
    }

    .submit-btn {
      background: #ff9900;
      color: #000000;
      font-weight: 700;
      font-size: 16px;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(255, 153, 0, 0.3);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      background: #e68a00;
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }
    .status-msg.success { color: #10b981; display: block; }
    .status-msg.error { color: #f87171; display: block; }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="nav-header">
      <a href="index.html" class="back-btn">← Back to Roulette</a>
      <h1 class="page-title">➕ Suggest a Spot</h1>
    </div>

    <form id="suggestForm" class="form-card" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label>Restaurant Name *</label>
        <input type="text" id="resName" placeholder="e.g. Restoran Ah Hock" required />
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Category *</label>
          <select id="resCategory" required>
            <option value="">Select...</option>
            <option value="Chinese">Chinese</option>
            <option value="Western">Western</option>
            <option value="Mamak">Mamak</option>
            <option value="Malay">Malay</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Thai">Thai</option>
            <option value="Cafe">Cafe / Bakery</option>
            <option value="Fast Food">Fast Food</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Price Range *</label>
          <select id="resPrice" required>
            <option value="">Select...</option>
            <option value="$">$ (&lt; RM15)</option>
            <option value="$$">$$ (RM15 - RM30)</option>
            <option value="$$$">$$$ (RM30+)</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Location / Area *</label>
          <input type="text" id="resLocation" placeholder="e.g. Kuantan / Town" required />
        </div>

        <div class="form-group">
          <label>Off Day</label>
          <select id="resOffDay">
            <option value="None">None</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Meal Session(s) Available</label>
        <div class="session-pills">
          <div class="session-chip" onclick="toggleSession(this, 'breakfast')">Breakfast</div>
          <div class="session-chip" onclick="toggleSession(this, 'lunch')">Lunch</div>
          <div class="session-chip" onclick="toggleSession(this, 'teatime')">Teatime</div>
          <div class="session-chip" onclick="toggleSession(this, 'dinner')">Dinner</div>
          <div class="session-chip" onclick="toggleSession(this, 'supper')">Supper</div>
        </div>
      </div>

      <div class="form-group">
        <label>Google Maps Link (Optional)</label>
        <input type="url" id="resMapsUrl" placeholder="https://maps.app.goo.gl/..." />
      </div>

      <div class="form-group">
        <label>Recommended Dishes / Remarks (Optional)</label>
        <textarea id="resRemark" rows="2" placeholder="e.g. Famous for Claypot Chicken Rice"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Submit Restaurant</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>
  </div>

  <script>
    // Paste your Google Apps Script Web App URL here
    const APPS_SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

    const selectedSessions = {
      breakfast: false,
      lunch: false,
      teatime: false,
      dinner: false,
      supper: false
    };

    function toggleSession(el, sessionKey) {
      selectedSessions[sessionKey] = !selectedSessions[sessionKey];
      el.classList.toggle('selected', selectedSessions[sessionKey]);
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        alert('Please configure your Google Apps Script Web App URL in submit.html!');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.textContent = 'Submitting...';
      statusMsg.className = 'status-msg';
      statusMsg.textContent = '';

      const payload = {
        name: document.getElementById('resName').value.trim(),
        category: document.getElementById('resCategory').value,
        price: document.getElementById('resPrice').value,
        location: document.getElementById('resLocation').value.trim(),
        offDay: document.getElementById('resOffDay').value,
        breakfast: selectedSessions.breakfast,
        lunch: selectedSessions.lunch,
        teatime: selectedSessions.teatime,
        dinner: selectedSessions.dinner,
        supper: selectedSessions.supper,
        mapsUrl: document.getElementById('resMapsUrl').value.trim(),
        remark: document.getElementById('resRemark').value.trim()
      };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Solves Google Apps Script CORS restrictions
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.className = 'status-msg success';
        statusMsg.textContent = '✅ Restaurant submitted successfully to Google Sheet!';
        document.getElementById('suggestForm').reset();
        
        // Reset sessions
        Object.keys(selectedSessions).forEach(k => selectedSessions[k] = false);
        document.querySelectorAll('.session-chip').forEach(c => c.classList.remove('selected'));

      } catch (err) {
        console.error('Submission error:', err);
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = '❌ Failed to submit. Please try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit Restaurant';
      }
    }
  </script>
</body>
</html>
